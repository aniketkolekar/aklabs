name: Setup
description: Checkout, install pnpm, setup Node, install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - uses: actions/setup-node@v4
      with:
        node-version: 20.18.1
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
