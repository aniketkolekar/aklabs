name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: pnpm build:all
      - uses: actions/upload-artifact@v4
        with:
          name: dist-utils
          path: packages/utils/dist
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      # NPM_TOKEN must be set in GitHub repo Settings → Secrets and variables → Actions
      # before triggering a publish. Never hardcode or log this token.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: dist-utils
          path: packages/utils/dist

      - run: pnpm publish --filter @aklabs/utils --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
